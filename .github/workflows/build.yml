name: Desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos-arm64:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build macOS ARM64
        run: npm run build:mac-arm64

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: erzsebet-telepi-desktop-macos-arm64
          path: dist/*mac-arm64.dmg
          if-no-files-found: error

  build-macos-x64:
    name: macOS DMG (Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build macOS x64
        run: npm run build:mac-x64

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: erzsebet-telepi-desktop-macos-x64
          path: dist/*mac-x64.dmg
          if-no-files-found: error

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: erzsebet-telepi-desktop-windows
          path: dist/*.exe
          if-no-files-found: error
